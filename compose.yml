name: oshiire-jiho-ch
services:
  oshiire-jiho-ch:
    build: .
    container_name: oshiire-jiho-ch
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./app/build
        target: /app/build
        bind:
          create_host_path: true
      - type: bind
        source: ./app/config
        target: /app/config
        bind:
          create_host_path: true
      - type: bind
        source: ./app/data
        target: /app/data
        bind:
          create_host_path: true
      - type: bind
        source: ./app/bin
        target: /app/bin
        bind:
          create_host_path: true
